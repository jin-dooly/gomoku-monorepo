services:
  - type: web
    name: gomoku-server
    runtime: node
    plan: free
    buildCommand: npx --yes pnpm@10.28.1 install --frozen-lockfile && npx --yes pnpm@10.28.1 turbo run build --filter=@gomoku/server
    startCommand: node apps/server/dist/main.js
    healthCheckPath: /health
    envVars:
      - key: CLIENT_URL
        sync: false # Render 대시보드에서 Vercel 주소 입력
